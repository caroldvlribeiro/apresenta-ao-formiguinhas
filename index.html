<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06182b">
  <title>Formiguinhas da Praia — Apresentação</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #06182b;
    }

    .presentation {
      width: 100%;
      height: 100%;
    }

    .presentation-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="presentation" aria-label="Apresentação Formiguinhas da Praia" tabindex="-1">
    <iframe
      class="presentation-frame"
      id="presentation-frame"
      src="slides/01_capa.html"
      title="Apresentação Formiguinhas da Praia"
      allowfullscreen>
      <p>Seu navegador não conseguiu abrir a apresentação. <a href="slides/01_capa.html">Abrir o primeiro slide</a>.</p>
    </iframe>
  </main>
  <script>
    const slideFrame = document.getElementById('presentation-frame');
    const presentation = document.querySelector('.presentation');
    const slidePaths = [
      'slides/01_capa.html',
      'slides/02_historia.html',
      'slides/03_problema_personas.html',
      'slides/04_solucao_mvp.html',
      'slides/05_site.html',
      'slides/06_identidade_ux.html',
      'slides/07_arquitetura.html',
      'slides/08_bancos.html',
      'slides/09_backend_apis.html',
      'slides/10_demonstracao.html',
      'slides/11_publicacao.html',
      'slides/12_encerramento.html'
    ];
    let currentSlideIndex = 0;

    function navigateWithArrow(event) {
      const step = event.key === 'ArrowRight' ? 1 : event.key === 'ArrowLeft' ? -1 : 0;

      if (step === 0) return;
      event.preventDefault();

      const nextSlideIndex = currentSlideIndex + step;
      if (nextSlideIndex < 0 || nextSlideIndex >= slidePaths.length) return;

      currentSlideIndex = nextSlideIndex;
      presentation.focus({ preventScroll: true });
      slideFrame.src = slidePaths[currentSlideIndex];
    }

    document.addEventListener('keydown', navigateWithArrow);
    slideFrame.addEventListener('load', () => {
      const slideDocument = slideFrame.contentDocument;
      if (!slideDocument) return;

      const slidePath = new URL(slideFrame.contentWindow.location.href).pathname;
      const loadedSlideIndex = slidePaths.findIndex(path => slidePath.endsWith(path));
      if (loadedSlideIndex >= 0) currentSlideIndex = loadedSlideIndex;

      slideDocument.addEventListener('keydown', navigateWithArrow);
      slideDocument.querySelectorAll('.slide-navigation a').forEach(link => {
        link.addEventListener('click', () => presentation.focus({ preventScroll: true }));
      });
    });
  </script>
</body>
</html>
