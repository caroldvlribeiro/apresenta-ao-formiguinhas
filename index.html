<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00306b">
  <meta http-equiv="refresh" content="0; url=slides/01_capa.html">
  <title>Formiguinhas da Praia — Apresentação</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", sans-serif;
      color: #0b1e3d;
      background: #f9f6ee;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
    }

    main {
      width: min(100%, 560px);
      padding: 36px;
      border: 1px solid #dfe6ef;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 16px 48px rgba(0, 48, 107, .12);
      text-align: center;
    }

    h1 { margin: 0 0 10px; color: #00306b; font-size: clamp(1.7rem, 6vw, 2.4rem); }
    p { color: #52657c; line-height: 1.55; }

    a {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
      padding: 0 22px;
      border-radius: 12px;
      color: #00306b;
      background: #f4e01e;
      font-weight: 800;
      text-decoration: none;
    }

    a:focus-visible { outline: 3px solid #005ed1; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Formiguinhas da Praia</h1>
    <p>A apresentação está sendo aberta. Se não iniciar automaticamente, use o botão abaixo.</p>
    <a href="slides/01_capa.html">Abrir apresentação</a>
  </main>
</body>
</html>
