<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container {
      width: 1280px;
      height: 720px;
      background: #00306B;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Quicksand', sans-serif;
      padding: 38px 64px;
    }
    h2 {
      width: 100%;
      text-align: center;
      font-family: 'Fredoka', sans-serif;
      font-size: 44px;
      color: #F4E01E;
      margin-bottom: 14px;
      line-height: 1.1;
    }
    .panel-label { font-size: 21px; font-weight: 700; color: #FFFFFF; margin-bottom: 12px; text-align: center; }
    .management-image {
      display: block;
      width: min(1090px, 100%);
      height: 330px;
      object-fit: contain;
      object-position: center;
      background: transparent;
      border: 0;
      border-radius: 8px;
    }
    .caption { margin-top: 9px; font-size: 17px; color: #FFFFFF; text-align: center; }
    .modules-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 24px;
      color: #00A3E0;
      margin-top: 18px;
      margin-bottom: 12px;
      text-align: center;
    }
    .modules {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 14px 16px;
    }
    .module {
      background: #0058B9;
      color: #FFFFFF;
      border-left: 6px solid #F4E01E;
      border-radius: 28px;
      padding: 12px 22px;
      font-size: 19px;
      font-weight: 700;
      text-align: center;
    }
  </style>
  <link href="../css/navegacao.css" rel="stylesheet">
  <link href="../css/apresentacao-responsiva.css" rel="stylesheet">
</head>
<body>
  <div class="slide-container">
    <h2>Plataforma de gestão integrada</h2>
    <p class="panel-label">Quadro de gestão do sistema</p>
    <img class="management-image" src="../assets/user_photos/tela-home.png" alt="Captura do quadro de gestão do sistema Formiguinhas da Praia">
    <p class="caption">Painel administrativo — captura real do sistema.</p>
    <p class="modules-title">Módulos</p>
    <div class="modules" aria-label="Módulos do sistema">
      <span class="module">Voluntários</span>
      <span class="module">Praias e ações</span>
      <span class="module">Doações e estoque</span>
      <span class="module">Resíduos</span>
      <span class="module">Relatórios</span>
    </div>
  </div>
  <nav class="slide-navigation" aria-label="Navegação da apresentação">
    <a class="slide-nav-arrow" href="03_problema_personas.html" aria-label="Slide anterior" title="Slide anterior">←</a>
    <a class="slide-nav-arrow" href="05_site.html" aria-label="Próximo slide" title="Próximo slide">→</a>
  </nav>
</body>
</html>
